}

  } else if(i===1){

    <p>The four friends decide to learn more about ${g('climate')} change and find ways to make their school more environmentally friendly.</p></div>
    <p>Tap a highlighted word to see its meaning. ${sy('It is a sunny Monday morning. Rina, Budi, Siti, and Andi are walking to school. It is really hot today! I think the weather is getting hotter every year. The school playground has very few trees. Maybe we need more trees around our school. That is a good idea! Trees provide shade and help make our environment cooler.')}</p>

    <p class="status">Listening: finish the Listening page to complete this chapter.</p>
    <h3>Language focus</h3><ul><li>Describing weather.</li><li>Present Simple Tense.</li><li>Environmental vocabulary.</li></ul>`;
  } else if(i===2){

    <button class="btn" data-act="saveThink">Save my suggestions</button><p class="fb" id="think-fb"></p>`;
  } else if(i===4){

  } else {
    const r=store.get('reflect',[]);
    const RQ=["What new things have you learned about climate change?","Which English activity helped you learn the most?","What environmental problem concerns you the most?","How can technology help us learn about sustainability?","What sustainable habit will you continue practising?"];
    body=`<h2>Reflect and Share</h2><p class="topic"><b>Topic:</b> Becoming a Lifelong Eco Learner.</p>
    <h3>Learning objectives</h3><ul><li>Reflect on learning experiences.</li><li>Express opinions.</li><li>Develop independent learning habits.</li></ul>
    <div class="note"><p>“Learning about the environment does not stop when this course ends. Being a lifelong learner means continuing to explore, ask questions, and apply knowledge in everyday life.”</p></div>
    <h3>Reflection form</h3>
    ${RQ.map((q,k)=>`<p><b>${k+1}. ${q}</b></p><textarea data-act="input" data-k="reflect" data-i="${k}" id="r${k}">${esc(r[k]||'')}</textarea>`).join('')}
    <button class="btn" data-act="saveReflect">Save my reflections</button><p class="fb" id="reflect-fb"></p>
    <h3>Keep learning beyond class</h3><ul><li>Learn one new climate word each day in the Vocabulary Center.</li><li>Listen to one short environmental audio each week.</li><li>Try one green action and write about it.</li><li>Explore one resource from the References page.</li><li>Share one environmental tip with a friend or family member.</li></ul>
    <p><i>Learn something new, practise it, reflect on it, and share it with others.</i></p>
    <div class="res">A better planet starts with better choices. Keep learning, keep caring, and keep taking action!</div>`;
  }
  return sub+body+status+foot;
}

function chDone(i){return CHREQ[i].every(k=>done.has(k))}
const done=new Set(store.get('done',[]));
function mark(k){if(!done.has(k)){done.add(k);store.set('done',[...done]);renderNav()}}

function renderNav(){
  $('#nav').innerHTML=PAGES.map(([id,label])=>`<button class="pill ${page===id?'on':''}" data-go="${id}" ${page===id?'aria-current="page"':''}>${label}</button>`).join('');
  const n=CHS.filter((_,i)=>chDone(i)).length;
  $('#pf').style.width=(n/6*100)+'%';
  $('#pt').textContent=n+' of 6 chapters completed';
}
let page='home', chi=0;
function render(){
  renderNav();
  $('#main').innerHTML=VIEWS[page]();
  Object.keys(QUIZ).forEach(drawQuiz);
  if(page==='chapters'&&chi===4) updateChallenge();
}
function go(p,c){
  page=p; if(c!==undefined) chi=+c;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  render(); scrollTo({top:0});
}
function speak(t,slow){
  if(!('speechSynthesis' in window)){$('#gl').textContent='Audio is not supported in this browser. Please read the text aloud.';return false}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=slow?0.6:0.9;
  speechSynthesis.speak(u); return true;
}
function updateChallenge(){
  const el=$('#cstat'); if(!el) return;
  const days=store.get('days',Array(7).fill(false));
  const n=days.filter(Boolean).length;
  el.innerHTML=`<div class="stats"><div><b>${n}</b> of 7 days done</div><div><b>${Math.round(n/7*100)}%</b> complete</div><div><b>${n===7?1:0}</b> full challenge completed</div></div><div class="bar"><i style="width:${n/7*100}%"></i></div>${n===7?'<p class="res">Amazing! You are a climate hero! 🎉</p>':''}`;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');
  if(!t) return;
  if(t.id==='fz'){const b=document.body.classList.toggle('big');t.setAttribute('aria-pressed',b);t.textContent=b?'Normal text':'Larger text';return}
  if(t.dataset.say!==undefined){speak(t.dataset.say,false);return}
  if(t.dataset.go){go(t.dataset.go,t.dataset.ch);return}
  const a=t.dataset.act; if(!a) return;
  switch(a){
    case 'gloss':{const d=G[t.dataset.g];$('#gl').innerHTML=`<b>${t.dataset.g}</b>: ${d[0]} (${d[1]})`;break}
    case 'qo':{const Q=QUIZ[t.dataset.q];if(!Q.checked){Q.sel[t.dataset.i]=+t.dataset.j;drawQuiz(t.dataset.q)}break}
    case 'qc':{const Q=QUIZ[t.dataset.q];Q.checked=true;if(Q.key)mark(Q.key);drawQuiz(t.dataset.q);break}
    case 'qr':{const Q=QUIZ[t.dataset.q];Q.sel={};Q.checked=false;drawQuiz(t.dataset.q);break}
    case 'ml':{
      const grp=t.closest('.mgroup'); if(t.classList.contains('matched')) break;
      grp.querySelectorAll('.mL.sel').forEach(x=>x.classList.remove('sel'));
      t.classList.add('sel'); break}
    case 'mr':{
      const grp=t.closest('.mgroup'), fb=document.getElementById('fb-'+grp.dataset.g);
      if(t.classList.contains('matched')) break;
      const L=grp.querySelector('.mL.sel');
      if(!L){fb.className='fb';fb.textContent='Choose a name on the left first.';break}
      if(L.dataset.mi===t.dataset.mi){
        L.classList.remove('sel');L.classList.add('matched');t.classList.add('matched');
        const total=grp.querySelectorAll('.mL').length, found=grp.querySelectorAll('.mL.matched').length;
        fb.className='fb ok';
        fb.textContent=found===total?'All matched. Well done!':'Correct!';
        if(found===total) mark(grp.dataset.key);
      } else {
        L.classList.remove('sel');fb.className='fb no';fb.textContent='Try again.';
      }
      break}
    case 'flip':{const b=document.getElementById('vb-'+t.dataset.i);b.hidden=!b.hidden;t.textContent=b.hidden?'Show meaning':'Hide meaning';break}
    case 'tts':{const s=LS.find(x=>x.id===t.dataset.id);if(speak(s.text,false))mark('listen');else $('#lfb').textContent='Audio is not supported in this browser. Please read the transcript aloud.';break}
    case 'pause':{if('speechSynthesis' in window)speechSynthesis.pause();break}
    case 'resume':{if('speechSynthesis' in window)speechSynthesis.resume();break}
    case 'stop':{if('speechSynthesis' in window)speechSynthesis.cancel();break}
    case 'saveThink':{
      const v=$('#think').value; store.set('think',v);
      const parts=v.split(/[.!?\n]+/).map(s=>s.trim()).filter(s=>s.length>3);
      const fb=$('#think-fb');
      if(parts.length>=2){fb.className='fb ok';fb.textContent='Great! You wrote '+parts.length+' suggestions.';mark('think')}
      else{fb.className='fb no';fb.textContent='Please write at least two suggestions.'}
      break}
    case 'saveWrite':{
      const v=$('#write').value; store.set('write',v);
      const n=v.trim().split(/\s+/).filter(Boolean).length, fb=$('#write-fb');
      if(n>=40){fb.className='fb ok';fb.textContent='Great! You wrote '+n+' words.';mark('write5')}
      else{fb.className='fb no';fb.textContent='Write a little more (about 5 to 7 sentences). You have '+n+' words.'}
      break}
    case 'saveReflect':{
      const vals=[0,1,2,3,4].map(k=>$('#r'+k).value.trim()); store.set('reflect',vals);
      const fb=$('#reflect-fb');
      if(vals.filter(Boolean).length>=3){fb.className='fb ok';fb.textContent='Saved! Thank you for reflecting.';mark('reflect')}
      else{fb.className='fb no';fb.textContent='Please answer at least three questions.'}
      break}
  }
});

document.addEventListener('input',e=>{

  if(!t.dataset||t.dataset.act!=='input') return;
  if(t.dataset.k==='reflect'){const arr=store.get('reflect',[]);arr[+t.dataset.i]=t.value;store.set('reflect',arr)}
  else store.set(t.dataset.k,t.value);
});
render();
</script>
